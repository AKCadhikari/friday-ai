[project]
name = "friday-ai"
version = "2.0.0"
description = "F.R.I.D.A.Y. - Tony Stark AI Voice Assistant (Enhanced Edition)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "python-dotenv",
    "psutil",
    "pyjokes",
    "pytz",
    "wikipedia-api",
]

[project.scripts]
friday = "friday.server:main"
friday_voice = "friday.agent_friday:dev"

[tool.hatch.build.targets.wheel]
packages = ["friday"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

